<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>Parcel / 本地故障示例</title><style>body{background:#10171e;color:#e9f0f6;font:18px system-ui;padding:60px}small{color:#87ccb3}h1{font-size:52px}section{background:#1c2730;border:1px solid #3a4955;border-radius:18px;padding:30px;max-width:700px}button{padding:18px 26px;border:0;border-radius:10px;background:#bdeecd;color:#14251c;margin:14px 10px 0 0;font-weight:600;cursor:pointer}#export{background:#f6bb7f}#feedback{color:#bdeecd;height:30px}</style></head><body><small>BUGCAM · 内置故障示例 · 故意包含 JavaScript 异常</small><h1>Parcel 工作区</h1><section><h2>十月更新笔记</h2><p>Three 次操作. One broken export.</p><button id="preview">预览笔记</button><button id="save">保存草稿</button><button id="export">导出报告</button><p id="feedback">可以开始编辑。</p></section><script>document.querySelector('#preview').onclick=()=>document.querySelector('#feedback').textContent='预览已打开。';document.querySelector('#save').onclick=()=>document.querySelector('#feedback').textContent='草稿已保存至当前页面。';document.querySelector('#export').onclick=()=>{document.querySelector('#feedback').textContent='导出失败：缺少报告数据。';throw new Error('导出失败：报告数据未定义');};</script></body></html>
