<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>Parcel / 本地故障示例</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e6de;color:#292d2a;font:18px "Avenir Next","PingFang SC",sans-serif}header{padding:25px 54px;border-bottom:1px solid #c7c5bc;display:flex;justify-content:space-between;align-items:center}header b{font-size:26px;letter-spacing:-1px}small{font-size:12px;color:#6e7269}main{padding:40px 54px}nav{font-size:13px;color:#72756e;margin-bottom:30px}article{display:grid;grid-template-columns:1fr 240px;gap:40px}h1{font-size:42px;font-weight:500;letter-spacing:-1px;margin:14px 0 24px}p{line-height:1.8}.document{border-top:2px solid #555c50;padding-top:24px}.document p{font-size:18px;color:#555c50;max-width:560px}aside{border-left:1px solid #c4c6bb;padding-left:28px}aside span{display:block;font-size:12px;color:#74786e;margin:10px 0}button{display:block;width:100%;padding:15px 12px;border:1px solid #b4b8ac;background:transparent;color:#333d32;font:500 15px inherit;text-align:left;margin-bottom:12px;cursor:pointer}#export{background:#3e493c;color:#f4f2e9;border:0}#feedback{padding:18px 22px;margin-top:40px;border:1px solid #c4c1b5;font-size:15px;min-height:65px;background:#f3f0e8}#feedback.failed{border-color:#b39362;background:#eee1c8;color:#735021}
</style></head><body><header><b>Parcel.</b><small>BugCam 内置故障示例 · 故意包含异常</small></header><main><nav>工作区 / 更新笔记 / 十月</nav><article><section class="document"><small>更新笔记</small><h1>十月更新笔记</h1><p>整理本月的改动，预览内容，然后导出报告。</p><p>这是一份用于浏览器测试的示例文档。预览和保存可以正常操作；导出按钮故意缺少报告数据。</p></section><aside><span>文档操作</span><button id="preview">预览笔记</button><button id="save">保存草稿</button><button id="export">导出报告 ↗</button><small>仅保存在本次页面中</small></aside></article><p id="feedback">尚未操作。</p></main><script>document.querySelector('#preview').onclick=()=>document.querySelector('#feedback').textContent='预览已打开。';document.querySelector('#save').onclick=()=>document.querySelector('#feedback').textContent='草稿已保存至当前页面。';document.querySelector('#export').onclick=()=>{const feedback=document.querySelector('#feedback');feedback.textContent='导出失败：缺少报告数据。';feedback.className='failed';throw new Error('导出失败：报告数据未定义');};</script></body></html>
